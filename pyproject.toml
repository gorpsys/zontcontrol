[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zontcontrol"
dynamic = ["version"]
description = "Read ZONT heating data, assess heating response, and prepare explicit control commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zontcontrol = "zontcontrol.application:main"
zontcontrol-get-token = "zontcontrol.get_token:main"

[tool.setuptools.packages.find]
include = ["zontcontrol*"]

[tool.setuptools.dynamic]
version = {attr = "zontcontrol.__version__"}
