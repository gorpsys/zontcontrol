name: Project checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: make lint

  offline:
    name: Offline checks (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check release version
        env:
          VERSION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_EVENT: ${{ github.event_name }}
        run: |
          if [ "$VERSION_EVENT" = "pull_request" ]; then
            python -m scripts.release_version check --base "$VERSION_BASE_SHA"
          else
            python -m scripts.release_version check --allow-existing
          fi
      - name: Check product offline without ZONT credentials
        run: make check PYTHON=python
      - name: Check cloud ZIP outside the checkout without ZONT credentials
        env:
          CLOUD_PACKAGE_SHA: ${{ github.sha }}
        run: make cloud-package-check PYTHON=python
      - name: Install build tools after the release check
        run: python -m pip install 'setuptools>=68' wheel
      - name: Build, install and check wheel outside the checkout
        run: make package-check PYTHON=python

  offline-summary:
    name: Offline checks
    needs: offline
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both supported Python versions
        env:
          MATRIX_RESULT: ${{ needs.offline.result }}
        run: test "$MATRIX_RESULT" = success
